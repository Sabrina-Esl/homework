<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Filter for soft realistic 3D shadows and glows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#554488" flood-opacity="0.25"/>
    </filter>
    <filter id="glass-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>

    <!-- Reading Icon Gradients (Open 3D Book from Picture 1) -->
    <linearGradient id="book-spine-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="book-cover-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e69f8"/>
      <stop offset="100%" stop-color="#5a42d6"/>
    </linearGradient>
    <linearGradient id="page-left" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f3fa"/>
      <stop offset="100%" stop-color="#d9dfee"/>
    </linearGradient>
    <linearGradient id="page-right" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f3fa"/>
      <stop offset="100%" stop-color="#d9dfee"/>
    </linearGradient>
    <linearGradient id="page-curve-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5cce2"/>
      <stop offset="100%" stop-color="#a4aed1"/>
    </linearGradient>

    <!-- Listening Icon Gradients (Headphones + Soundwaves from Picture 1) -->
    <linearGradient id="hp-band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="35%" stop-color="#d9e1f5"/>
      <stop offset="70%" stop-color="#c1cdf0"/>
      <stop offset="100%" stop-color="#98a7da"/>
    </linearGradient>
    <linearGradient id="hp-cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#846ff7"/>
      <stop offset="60%" stop-color="#694ee8"/>
      <stop offset="100%" stop-color="#4d35c2"/>
    </linearGradient>
    <linearGradient id="hp-silver-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d6def2"/>
      <stop offset="100%" stop-color="#9aa9d2"/>
    </linearGradient>
    <linearGradient id="wave-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Writing Icon Gradients (Vocabulary "Aa" 3D Block from Picture 1) -->
    <linearGradient id="aa-tile-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a58dfe"/>
      <stop offset="45%" stop-color="#8f70fa"/>
      <stop offset="100%" stop-color="#7751f5"/>
    </linearGradient>
    <linearGradient id="aa-tile-side-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e39d8"/>
      <stop offset="100%" stop-color="#4a26be"/>
    </linearGradient>
    <linearGradient id="aa-tile-side-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#714de3"/>
      <stop offset="100%" stop-color="#5530c9"/>
    </linearGradient>
    <linearGradient id="aa-letter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf1fd"/>
    </linearGradient>

    <!-- Speaking Icon Gradients (Studio Mic + Audio Waves from Picture 1) -->
    <linearGradient id="mic-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b85ff"/>
      <stop offset="45%" stop-color="#7a5ef6"/>
      <stop offset="100%" stop-color="#5c3be0"/>
    </linearGradient>
    <linearGradient id="mic-grille" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d6def0"/>
      <stop offset="100%" stop-color="#93a2cb"/>
    </linearGradient>
    <linearGradient id="mic-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="60%" stop-color="#c8d2ea"/>
      <stop offset="100%" stop-color="#8f9ebf"/>
    </linearGradient>
    <linearGradient id="speaking-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Medal / Trophy Gradients -->
    <linearGradient id="gold-medal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="purple-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d7eff"/>
      <stop offset="50%" stop-color="#7c5cfa"/>
      <stop offset="100%" stop-color="#5a39dc"/>
    </linearGradient>

    <!-- Star Symbol -->
    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7cd"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- ==============================================
       1. READING ICON: 3D Open Book with Pages & Spine
       ============================================== -->
  <symbol id="icon-reading" viewBox="0 0 100 100">
    <!-- Soft shadow below book -->
    <ellipse cx="50" cy="80" rx="36" ry="9" fill="#6050a0" opacity="0.22" filter="url(#soft-shadow)"/>
    
    <!-- Hardcover spine & base (golden/yellow at center bottom) -->
    <path d="M 50 68 L 47 78 L 50 82 L 53 78 Z" fill="url(#book-spine-gold)"/>
    
    <!-- Outer Cover Bottom Edges (Curved blue-purple under pages) -->
    <path d="M 16 66 C 26 68 40 67 48 71 L 48 73 C 38 70 24 70 14 68 Z" fill="url(#book-cover-base)"/>
    <path d="M 84 66 C 74 68 60 67 52 71 L 52 73 C 62 70 76 70 86 68 Z" fill="url(#book-cover-base)"/>

    <!-- Left Page Stack (Curved 3D pages) -->
    <path d="M 18 35 C 32 30 42 36 49 41 L 49 71 C 41 66 30 62 17 66 Z" fill="url(#page-left)"/>
    <!-- Left Page Fold lines and layers -->
    <path d="M 17 66 C 29 63 39 67 49 71 L 49 72 C 39 68 28 64 16 67 Z" fill="url(#page-curve-shadow)" opacity="0.7"/>
    <path d="M 20 40 C 31 36 39 40 45 44" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 20 46 C 31 42 39 46 45 50" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 20 52 C 31 48 39 52 45 56" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Right Page Stack (Curved 3D pages) -->
    <path d="M 82 35 C 68 30 58 36 51 41 L 51 71 C 59 66 70 62 83 66 Z" fill="url(#page-right)"/>
    <!-- Right Page Fold lines and layers -->
    <path d="M 83 66 C 71 63 61 67 51 71 L 51 72 C 61 68 72 64 84 67 Z" fill="url(#page-curve-shadow)" opacity="0.7"/>
    <path d="M 80 40 C 69 36 61 40 55 44" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 80 46 C 69 42 61 46 55 50" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 80 52 C 69 48 61 52 55 56" stroke="#c0cbe3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Center Spine Valley shadow -->
    <path d="M 48 40 Q 50 42 52 40 L 52 71 Q 50 72 48 71 Z" fill="#9ba8ce" opacity="0.5"/>

    <!-- Golden Bookmark Ribbon Hanging down -->
    <path d="M 49 41 L 49 76 L 50 78 L 51 76 L 51 41 Z" fill="url(#book-spine-gold)"/>
    <polygon points="48,76 50,73 52,76 52,79 50,77 48,79" fill="#f59e0b"/>

    <!-- Specular light sparkle on top corner -->
    <circle cx="20" cy="33" r="1.5" fill="#ffffff"/>
    <path d="M 76 28 Q 78 28 78 26 Q 78 28 80 28 Q 78 28 78 30 Q 78 28 76 28 Z" fill="#ffd15c"/>
  </symbol>

  <!-- ==================================================
       2. LISTENING ICON: 3D Headphones + Wave Equalizer
       ================================================== -->
  <symbol id="icon-listening" viewBox="0 0 100 100">
    <!-- Soft shadow -->
    <ellipse cx="50" cy="82" rx="34" ry="8" fill="#6050a0" opacity="0.22" filter="url(#soft-shadow)"/>

    <!-- Metallic Pearl Headband Arch -->
    <path d="M 24 55 C 22 30 35 18 50 18 C 65 18 78 30 76 55" 
          stroke="url(#hp-band)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 27 50 C 26 33 37 21 50 21 C 63 21 74 33 73 50" 
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Equalizer Sound Wave Bars (Lavender to Gold, like picture 1) -->
    <g id="sound-bars">
      <!-- Bar 1 (Left) -->
      <rect x="36" y="52" width="4.5" height="14" rx="2.25" fill="#a78bfa"/>
      <!-- Bar 2 -->
      <rect x="43" y="44" width="4.5" height="24" rx="2.25" fill="url(#wave-gold)" filter="url(#gold-glow)"/>
      <!-- Bar 3 (Center - Highest) -->
      <rect x="50" y="38" width="4.5" height="32" rx="2.25" fill="url(#wave-gold)" filter="url(#gold-glow)"/>
      <!-- Bar 4 -->
      <rect x="57" y="46" width="4.5" height="20" rx="2.25" fill="url(#wave-gold)" filter="url(#gold-glow)"/>
      <!-- Bar 5 (Right) -->
      <rect x="64" y="54" width="4.5" height="10" rx="2.25" fill="#a78bfa"/>
    </g>

    <!-- Left Ear Cup (Silver rim + Violet cushion) -->
    <g transform="translate(14, 45) rotate(-6)">
      <!-- Outer silver casing -->
      <rect x="0" y="0" width="14" height="28" rx="7" fill="url(#hp-silver-cap)"/>
      <rect x="2" y="2" width="4" height="24" rx="2" fill="#ffffff" opacity="0.7"/>
      <!-- Inner soft purple cushion -->
      <rect x="9" y="3" width="7" height="22" rx="3.5" fill="url(#hp-cushion)"/>
    </g>

    <!-- Right Ear Cup (Silver rim + Violet cushion) -->
    <g transform="translate(73, 44) rotate(6)">
      <!-- Inner soft purple cushion -->
      <rect x="-3" y="3" width="7" height="22" rx="3.5" fill="url(#hp-cushion)"/>
      <!-- Outer silver casing -->
      <rect x="0" y="0" width="14" height="28" rx="7" fill="url(#hp-silver-cap)"/>
      <rect x="8" y="2" width="4" height="24" rx="2" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Glint / Sparkle -->
    <circle cx="30" cy="24" r="1.8" fill="#ffffff"/>
  </symbol>

  <!-- ==============================================================
       3. WRITING ICON: 3D Vocabulary "Aa" Tile (From Picture 1)
       ============================================================== -->
  <symbol id="icon-writing" viewBox="0 0 100 100">
    <!-- Soft shadow below tile -->
    <path d="M 18 58 L 50 78 L 82 58 L 50 42 Z" fill="#503598" opacity="0.25" filter="url(#soft-shadow)"/>
    
    <!-- 3D Beveled Tile Bottom/Sides -->
    <!-- Left side extruded depth -->
    <path d="M 16 50 L 50 69 L 50 77 L 16 58 Z" fill="url(#aa-tile-side-left)"/>
    <!-- Right side extruded depth -->
    <path d="M 50 69 L 84 50 L 84 58 L 50 77 Z" fill="url(#aa-tile-side-right)"/>
    
    <!-- 3D Tile Top Face (Isometric Rounded Diamond) -->
    <path d="M 50 25 C 52 23 55 23 58 25 L 82 41 C 85 43 85 47 82 49 L 58 65 C 55 67 52 67 50 65 L 20 49 C 17 47 17 43 20 41 Z" 
          fill="url(#aa-tile-top)"/>

    <!-- Glossy border highlight along top edges -->
    <path d="M 21 42 L 50 25 L 80 42" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 50 66 L 81 48" stroke="#ccaeff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- "Aa" 3D White Embossed Typography -->
    <!-- Capital 'A' with soft drop shadow -->
    <text x="35" y="53" 
          font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
          font-size="25" 
          font-weight="900" 
          fill="#482aa5" 
          opacity="0.45">A</text>
    <text x="34" y="51" 
          font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
          font-size="25" 
          font-weight="900" 
          fill="url(#aa-letter-grad)">A</text>

    <!-- Lowercase 'a' with soft drop shadow -->
    <text x="56" y="53" 
          font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
          font-size="20" 
          font-weight="900" 
          fill="#482aa5" 
          opacity="0.45">a</text>
    <text x="55" y="51" 
          font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" 
          font-size="20" 
          font-weight="900" 
          fill="url(#aa-letter-grad)">a</text>

    <!-- Sparkle Stars like in Picture 1 -->
    <path d="M 75 22 Q 77 22 77 20 Q 77 22 79 22 Q 77 22 77 24 Q 77 22 75 22 Z" fill="#ffffff"/>
    <path d="M 83 28 Q 85 28 85 26 Q 85 28 87 28 Q 85 28 85 30 Q 85 28 83 28 Z" fill="#ffd15c"/>
  </symbol>

  <!-- ==============================================================
       4. SPEAKING ICON: 3D Studio Mic + Golden Sound Waves (Picture 1)
       ============================================================== -->
  <symbol id="icon-speaking" viewBox="0 0 100 100">
    <!-- Soft shadow -->
    <ellipse cx="44" cy="84" rx="24" ry="7" fill="#6050a0" opacity="0.22" filter="url(#soft-shadow)"/>

    <!-- Round Weighted Base & Stem -->
    <ellipse cx="42" cy="80" rx="16" ry="5" fill="url(#mic-chrome)"/>
    <ellipse cx="42" cy="78" rx="14" ry="3.5" fill="#eaf0fa"/>
    <rect x="40" y="62" width="4" height="17" rx="2" fill="url(#mic-chrome)"/>

    <!-- U-shaped Pivot Yoke / Mounting bracket -->
    <path d="M 28 46 C 28 62 56 62 56 46" stroke="url(#mic-chrome)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="46" r="2.5" fill="#7a5ef6"/>
    <circle cx="56" cy="46" r="2.5" fill="#7a5ef6"/>

    <!-- Capsule Microphone Body -->
    <rect x="33" y="22" width="18" height="34" rx="9" fill="url(#mic-body)"/>

    <!-- Metallic Grille Upper Dome -->
    <path d="M 33 33 C 33 24 37 22 42 22 C 47 22 51 24 51 33 Z" fill="url(#mic-grille)"/>
    <!-- Grille texture lines -->
    <line x1="34" y1="26" x2="50" y2="26" stroke="#9bb0d8" stroke-width="1.2" opacity="0.8"/>
    <line x1="33.5" y1="30" x2="50.5" y2="30" stroke="#9bb0d8" stroke-width="1.2" opacity="0.8"/>
    <line x1="33" y1="34" x2="51" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Shiny specular vertical highlight on capsule -->
    <rect x="35" y="24" width="2" height="28" rx="1" fill="#ffffff" opacity="0.6"/>

    <!-- Golden Broadcast Sound Waves Radiating Out on Right -->
    <g id="mic-soundwaves">
      <!-- Wave 1 (inner) -->
      <path d="M 64 36 C 67 40 67 46 64 50" 
            stroke="url(#speaking-wave)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#gold-glow)"/>
      <!-- Wave 2 (middle) -->
      <path d="M 72 31 C 77 37 77 48 72 54" 
            stroke="url(#speaking-wave)" stroke-width="3.2" stroke-linecap="round" fill="none" filter="url(#gold-glow)"/>
      <!-- Wave 3 (outer) -->
      <path d="M 80 26 C 87 34 87 52 80 60" 
            stroke="url(#speaking-wave)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#gold-glow)"/>
    </g>

    <!-- Little Sparkle -->
    <path d="M 23 20 Q 25 20 25 18 Q 25 20 27 20 Q 25 20 25 22 Q 25 20 23 20 Z" fill="#ffd15c"/>
  </symbol>

  <!-- ==============================================
       MEDAL ICON: Gold Ribbon Medal (Vocabulary Round)
       ============================================== -->
  <symbol id="icon-medal" viewBox="0 0 100 100">
    <!-- Purple Ribbon tails (matching user's purple badge request) -->
    <path d="M 38 46 L 28 84 L 38 76 L 46 84 L 44 48 Z" fill="url(#purple-ribbon)"/>
    <path d="M 62 46 L 72 84 L 62 76 L 54 84 L 56 48 Z" fill="url(#purple-ribbon)" opacity="0.9"/>
    <!-- Gold Medallion -->
    <circle cx="50" cy="46" r="24" fill="url(#gold-medal)" filter="url(#gold-glow)"/>
    <circle cx="50" cy="46" r="20" fill="none" stroke="#fff4cf" stroke-width="1.8" opacity="0.9"/>
    <!-- Embossed 3D Star on Coin -->
    <polygon points="50,32 54,42 64,43 56,50 59,60 50,54 41,60 44,50 36,43 46,42" fill="#fff9db"/>
    <polygon points="50,32 54,42 64,43 56,50 59,60 50,54 50,32" fill="#f59e0b" opacity="0.45"/>
  </symbol>

  <!-- ==============================================
       GOLD STAR IN CIRCLE BADGE (Banner headers)
       ============================================== -->
  <symbol id="icon-star-badge" viewBox="0 0 100 100">
    <!-- Glossy White/Glass Circle -->
    <circle cx="50" cy="50" r="46" fill="#ffffff" filter="url(#soft-shadow)"/>
    <circle cx="50" cy="50" r="44" fill="url(#aa-letter-grad)"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <!-- Golden 3D Star -->
    <polygon points="50,22 58,38 76,40 62,53 66,70 50,61 34,70 38,53 24,40 42,38" fill="url(#star-gold)" filter="url(#gold-glow)"/>
    <polygon points="50,22 58,38 76,40 62,53 66,70 50,61 50,22" fill="#d97706" opacity="0.35"/>
  </symbol>

  <!-- ==============================================
       DIAMOND CRYSTAL (MSI School branding from Pic 1)
       ============================================== -->
  <symbol id="icon-crystal" viewBox="0 0 100 100">
    <polygon points="50,10 78,35 68,85 50,95 32,85 22,35" fill="#a78bfa"/>
    <polygon points="50,10 78,35 50,55 22,35" fill="#e0e7ff"/>
    <polygon points="50,55 78,35 68,85" fill="#818cf8"/>
    <polygon points="50,55 68,85 50,95" fill="#6366f1"/>
    <polygon points="50,55 50,95 32,85" fill="#4f46e5"/>
    <polygon points="50,55 32,85 22,35" fill="#a5b4fc"/>
    <polygon points="50,10 50,55 22,35" fill="#ffffff" opacity="0.8"/>
  </symbol>
</svg>
